 <header class="header">
    <div class="header-content">
        <div class="logo-container">
           
        </div>
        <div class="company-info">
            <h1> <img src="{{ logo_uri }}" alt="Logo" class="logo"> {{ report.firm.name }}</h1>
            <p>{{ report.firm.services }}</p>
        </div>
    </div>

    <div class="company-details">
        <h4>{{ report.firm.office_heading }}</h4>
        {% for line in report.firm.address_lines %}
        <p>{{ line }}</p>
        {% endfor %}
    </div>

    <div class="contact-info">
        <p><strong>Tel:</strong> {{ report.firm.phones | join(', ') }} <strong>Email:</strong> {{ report.firm.email }}</p>
        
    </div>
</header>
