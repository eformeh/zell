<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .main-content {
            padding: 40px;
        }

        .form-section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 1.5em;
            color: #374151;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-icon {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
        }

        input[type="date"] {
            width: 100%;
            max-width: 300px;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input[type="date"]:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .json-input-container {
            position: relative;
        }

        textarea {
            width: 100%;
            min-height: 400px;
            padding: 20px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: vertical;
            transition: all 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .json-tools {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            font-size: 18px;
            padding: 15px 30px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.3);
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
            border: 2px solid #e5e7eb;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }

        .validation-status {
            margin-top: 10px;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            display: none;
        }

        .validation-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .validation-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #f8fafc, #e2e8f0);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #4f46e5;
        }

        .stat-label {
            color: #64748b;
            margin-top: 5px;
        }

        .progress-container {
            margin-top: 30px;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: center;
            margin-top: 10px;
            color: #64748b;
        }

        .file-drop-zone {
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .file-drop-zone:hover {
            border-color: #4f46e5;
            background: #f8fafc;
        }

        .file-drop-zone.dragover {
            border-color: #4f46e5;
            background: #eef2ff;
        }

        .sample-data-btn {
            background: #10b981;
            color: white;
        }

        .sample-data-btn:hover {
            background: #059669;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 15px;
            }
            
            .main-content {
                padding: 20px;
            }
            
            .header {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Report Generator</h1>
            <p>Generate professional PDF reports from your JSON data</p>
        </div>

        <div class="main-content">
            <form id="reportForm">
                <!-- Date Section -->
                <div class="form-section">
                    <h2 class="section-title">
                        <span class="section-icon">📅</span>
                        Report Date
                    </h2>
                    <div class="form-group">
                        <label for="reportDate">Select the date for your reports:</label>
                        <input type="date" id="reportDate" name="reportDate" required>
                    </div>
                </div>

                <!-- JSON Data Section -->
                <div class="form-section">
                    <h2 class="section-title">
                        <span class="section-icon">📝</span>
                        Company Data
                    </h2>
                    
                    <!-- File Upload Zone -->
                    <div class="file-drop-zone" id="fileDropZone">
                        <p>📁 Drop your JSON file here or click to browse</p>
                        <input type="file" id="fileInput" accept=".json" style="display: none;">
                    </div>

                    <!-- JSON Tools -->
                    <div class="json-tools">
                        <button type="button" class="btn btn-secondary" onclick="validateJSON()">
                            ✓ Validate JSON
                        </button>
                        <button type="button" class="btn btn-secondary" onclick="formatJSON()">
                            🎨 Format JSON
                        </button>
                        <button type="button" class="btn btn-secondary sample-data-btn" onclick="loadSampleData()">
                            📋 Load Sample Data
                        </button>
                        <button type="button" class="btn btn-secondary" onclick="clearJSON()">
                            🗑️ Clear
                        </button>
                    </div>

                    <div class="form-group">
                        <label for="jsonData">Paste your JSON data here:</label>
                        <textarea 
                            id="jsonData" 
                            name="jsonData" 
                            placeholder="Paste your company data in JSON format..."
                            required
                        ></textarea>
                    </div>

                    <!-- Validation Status -->
                    <div id="validationStatus" class="validation-status"></div>

                    <!-- Data Statistics -->
                    <div id="dataStats" class="stats-container" style="display: none;">
                        <div class="stat-card">
                            <div class="stat-number" id="totalCompanies">0</div>
                            <div class="stat-label">Total Companies</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number" id="businessCount">0</div>
                            <div class="stat-label">Businesses</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number" id="companyCount">0</div>
                            <div class="stat-label">Companies</div>
                        </div>
                    </div>
                </div>

                <!-- Generate Button -->
                <div class="form-section">
                    <button type="submit" class="btn btn-primary">
                        🚀 Generate Reports
                    </button>
                </div>

                <!-- Progress Section -->
                <div id="progressContainer" class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="progress-text" id="progressText">Preparing reports...</div>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Set today's date as default
        document.getElementById('reportDate').valueAsDate = new Date();

        // Sample data for testing
        const sampleData = [
            {
                "id": 41,
                "company_name": "SIMGO POULTRIES HUB",
                "registration_number": "7645429",
                "category": "business",
                "registered_address": "NO.19 SHOTOMI STREET OKE ITUNU, IBADAN, OYO",
                "incorporation_date": "JUL 3, 2024",
                "main_object": "POULTRY SERVICES, FARMING AND GENERAL CONTRACTS",
                "proprietors": [
                    {
                        "name": "AKINTOLA OLUFEMI ABIODUN",
                        "address": "SHOTOMI STREET OKE ITUNU, IBADAN, OYO"
                    }
                ]
            },
            {
                "id": 45,
                "company_name": "SAS OF LAGOS LIFESTYLE LIMITED",
                "registration_number": "7416627",
                "category": "company",
                "registered_address": "BISOLA DUROSINMI ETTI DRIVE, LEKKI, LAGOS",
                "incorporation_date": "MAR 25, 2024",
                "main_object": "To carry on the businesses of entertainment promoters, sports promoters, event managers and representatives in all or any spheres of entertainment and sport.",
                "share_capital": "1,000,000",
                "current_share_capital": null,
                "allotted_share_capital": null,
                "directors": [
                    {
                        "name": "SANNI SHEDRACH ADAVOGU",
                        "address": "ADEBISI OMOTOLA CLOSE, VICTORIA ISLAND, LAGOS"
                    }
                ],
                "shareholders": [
                    {
                        "name": "SHEDRACH ADAVOGU SANNI",
                        "shares": "10000 ORDINARY SHARES"
                    }
                ],
                "company_sec": null
            }
        ];

        // File upload handling
        const fileDropZone = document.getElementById('fileDropZone');
        const fileInput = document.getElementById('fileInput');

        fileDropZone.addEventListener('click', () => fileInput.click());
        fileDropZone.addEventListener('dragover', handleDragOver);
        fileDropZone.addEventListener('drop', handleFileDrop);
        fileDropZone.addEventListener('dragleave', () => fileDropZone.classList.remove('dragover'));
        fileInput.addEventListener('change', handleFileSelect);

        function handleDragOver(e) {
            e.preventDefault();
            fileDropZone.classList.add('dragover');
        }

        function handleFileDrop(e) {
            e.preventDefault();
            fileDropZone.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                loadFile(files[0]);
            }
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                loadFile(file);
            }
        }

        function loadFile(file) {
            if (file.type !== 'application/json') {
                showValidation('Please select a JSON file', 'error');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('jsonData').value = e.target.result;
                validateJSON();
            };
            reader.readAsText(file);
        }

        function loadSampleData() {
            document.getElementById('jsonData').value = JSON.stringify(sampleData, null, 2);
            validateJSON();
        }

        function validateJSON() {
            const jsonText = document.getElementById('jsonData').value.trim();
            const statusDiv = document.getElementById('validationStatus');
            
            if (!jsonText) {
                showValidation('Please enter JSON data', 'error');
                return false;
            }

            try {
                const data = JSON.parse(jsonText);
                
                if (!Array.isArray(data)) {
                    showValidation('JSON must be an array of company objects', 'error');
                    return false;
                }

                if (data.length === 0) {
                    showValidation('JSON array cannot be empty', 'error');
                    return false;
                }

                // Validate each entry has required fields
                const requiredFields = ['company_name', 'registration_number', 'category'];
                let invalidEntries = [];
                
                data.forEach((entry, index) => {
                    const missing = requiredFields.filter(field => !entry[field]);
                    if (missing.length > 0) {
                        invalidEntries.push(`Entry ${index + 1}: missing ${missing.join(', ')}`);
                    }
                });

                if (invalidEntries.length > 0) {
                    showValidation(`Invalid entries found:\n${invalidEntries.join('\n')}`, 'error');
                    return false;
                }

                showValidation(`✓ Valid JSON with ${data.length} companies`, 'success');
                updateDataStats(data);
                return true;
                
            } catch (error) {
                showValidation(`Invalid JSON: ${error.message}`, 'error');
                return false;
            }
        }

        function formatJSON() {
            const jsonText = document.getElementById('jsonData').value.trim();
            if (!jsonText) return;

            try {
                const data = JSON.parse(jsonText);
                document.getElementById('jsonData').value = JSON.stringify(data, null, 2);
                showValidation('JSON formatted successfully', 'success');
            } catch (error) {
                showValidation(`Cannot format invalid JSON: ${error.message}`, 'error');
            }
        }

        function clearJSON() {
            document.getElementById('jsonData').value = '';
            document.getElementById('validationStatus').style.display = 'none';
            document.getElementById('dataStats').style.display = 'none';
        }

        function showValidation(message, type) {
            const statusDiv = document.getElementById('validationStatus');
            statusDiv.textContent = message;
            statusDiv.className = `validation-status validation-${type}`;
            statusDiv.style.display = 'block';
        }

        function updateDataStats(data) {
            const businessCount = data.filter(item => item.category === 'business').length;
            const companyCount = data.filter(item => item.category === 'company').length;
            
            document.getElementById('totalCompanies').textContent = data.length;
            document.getElementById('businessCount').textContent = businessCount;
            document.getElementById('companyCount').textContent = companyCount;
            document.getElementById('dataStats').style.display = 'grid';
        }

        function showProgress(show = true) {
            document.getElementById('progressContainer').style.display = show ? 'block' : 'none';
            if (!show) {
                document.getElementById('progressFill').style.width = '0%';
            }
        }

        function updateProgress(percent, message) {
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressText').textContent = message;
        }

        // Form submission
        document.getElementById('reportForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (!validateJSON()) {
                return;
            }

            const formData = {
                date: document.getElementById('reportDate').value,
                jsonData: document.getElementById('jsonData').value
            };

            generateReports(formData);
        });

        async function generateReports(formData) {
            showProgress(true);
            
            try {
                // Parse the JSON data for validation
                const data = JSON.parse(formData.jsonData);
                const totalReports = data.length;
                
                updateProgress(10, 'Sending data to server...');
                
                // Make actual API call to your Python backend
                const response = await fetch('/generate-reports', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        date: formData.date,
                        jsonData: formData.jsonData
                    })
                });
                
                updateProgress(50, 'Processing reports on server...');
                
                const result = await response.json();
                
                if (result.success) {
                    updateProgress(100, `✓ Successfully generated ${result.count} reports!`);
                    
                    // Show success message
                    setTimeout(() => {
                        alert(`Reports generated successfully!\n\nTotal reports: ${result.count}\nDate: ${formData.date}\n\nCheck your reports/pdf folder for the generated PDFs.`);
                        showProgress(false);
                    }, 1000);
                    
                } else {
                    throw new Error(result.error || 'Unknown server error');
                }
                
            } catch (error) {
                console.error('Error:', error);
                updateProgress(0, '❌ Error generating reports');
                
                // Show user-friendly error message
                let errorMessage = 'Error generating reports: ';
                if (error.message.includes('fetch')) {
                    errorMessage += 'Unable to connect to server. Make sure the Flask server is running.';
                } else {
                    errorMessage += error.message;
                }
                
                alert(errorMessage);
                showProgress(false);
            }
        }

        // Auto-validate JSON on input
        document.getElementById('jsonData').addEventListener('input', function() {
            const value = this.value.trim();
            if (value && value.length > 10) {
                // Debounce validation
                clearTimeout(this.validationTimeout);
                this.validationTimeout = setTimeout(validateJSON, 1000);
            }
        });
    </script>
</body>
</html>
